baseURL = "https://urielrobles.com/"
locale = "es-MX"
defaultContentLanguage = "es"
title = "Uriel Robles — Fotógrafo de producto y comida en Monterrey"
enableRobotsTXT = true

# Solo generamos HTML; sin RSS, sitemap de taxonomías, etc.
disableKinds = ["taxonomy", "term", "rss"]

[params]
  description = "Fotógrafo comercial en Monterrey. Fotografía de producto, comida y lifestyle para restaurantes y marcas que necesitan verse tan bien como lo que ofrecen."
  email = "hello@urielrobles.com"
  instagram = "urielrobles.film"
  whatsapp = "528117844804"
  whatsappLabel = "81 1784 4804"
  # Mensaje que aparece ya escrito al abrir WhatsApp desde los botones "Cotizar".
  whatsappMessage = "Hola Uriel, me gustaría cotizar un proyecto."
  location = "Monterrey, Nuevo León"
  phone = "+52 81 1784 4804"
  # Datos para Google (schema.org): ciudad, estado y país.
  city = "Monterrey"
  region = "Nuevo León"
  country = "MX"
  # Cloudflare Web Analytics (contador de visitas). Solo se carga en el sitio publicado.
  cloudflareAnalyticsToken = "83d72bb09b534b2d87ce485bbe351e26"

[imaging]
  resampleFilter = "Lanczos"
  # Las fotos se convierten a WebP en varios tamaños al compilar.
  [imaging.webp]
    quality = 82
  [imaging.jpeg]
    quality = 82

