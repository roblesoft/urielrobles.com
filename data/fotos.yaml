# Descripción de cada foto de las galerías (texto alternativo / "alt").
#
# Google la usa para entender la imagen (búsqueda de Google Imágenes) y los
# lectores de pantalla la leen en voz alta. También aparece debajo de la foto
# en el visor.
#
# Estos textos son un BORRADOR escrito a partir de lo que se ve en cada foto:
# revísalos y corrige nombres de platillos, bebidas o productos.
#
# Consejos:
#   - Una frase corta (máx. ~125 caracteres) que diga qué se ve.
#   - Menciona el nombre del cliente o lugar cuando ayude: "en la cafetería Audaz".
#   - No empieces con "Foto de…" ni "Imagen de…".
#   - Si dejas una descripción vacía (""), se usa "Proyecto — fotografía N de M".
#
# Para agregar una foto nueva: copia una línea en la carpeta correcta
# y cambia el nombre del archivo y la descripción.

